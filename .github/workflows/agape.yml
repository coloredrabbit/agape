# agape 트렌드 파이프라인 — 예약 실행 + 리포트 웹 게시(GitHub Pages)
#
# 이 워크플로는 agape/를 "독립 레포"로 푸시했을 때 동작한다(파일이 레포 루트의
# .github/workflows/ 에 위치해야 GitHub이 인식). 자세한 세팅은 README의
# "GitHub Actions로 무료 자동화" 참고.
#
# 공개/비공개 전환:
#   - 레포 가시성(Settings)을 바꾸면 코드·데이터·Pages가 함께 따라간다.
#   - 비공개로 가고 Pages를 끄려면 레포 변수 PUBLISH_PAGES=false 만 설정하면 된다
#     (그래도 collect/report/Slack/이메일은 계속 동작).

name: agape trend pipeline

on:
  # Apify task가 성공하면 웹훅으로 즉시 트리거된다 — "09:00에 끝났겠지" 하는 시간 가정을
  # 없애는 주 경로다(데이터가 준비된 정확한 시점에 실행되고, task가 실패하면 아예 안 돈다).
  # 설정 방법은 README "Apify 웹훅으로 트리거" 참고.
  repository_dispatch:
    types: [apify-instagram-finished]
  schedule:
    # 웹훅이 안 왔을 때를 위한 안전망. 웹훅이 정상 동작하면 같은 날 두 번 도는데, 저장은
    # 병합·읽기 시 dedupe되고 시트는 key 기준 upsert라 중복이 쌓이지 않는다(무해한 중복).
    # GitHub의 예약 실행은 best-effort로 최대 1~2시간 늦게 돈다(실측 ~11:00 KST) —
    # Apify task(09:00 KST) 뒤라는 순서만 지켜지면 되므로 문제되지 않는다.
    - cron: "30 0 * * *"     # 매일 09:30 KST — collect + 시트 upsert + Pages 갱신
    - cron: "0 1 * * 1"      # 매주 월 10:00 KST — discover + report 전송(채널)
  workflow_dispatch:          # 수동 실행 버튼(URL로 트리거 가능)
    inputs:
      full:
        description: "discover + report + Pages 까지 실행"
        type: boolean
        default: true

permissions:
  contents: write   # data/ 커밋백
  pages: write      # GitHub Pages 배포
  id-token: write   # Pages 배포(OIDC)

concurrency:
  group: agape-pipeline
  cancel-in-progress: false

env:
  # 시크릿 → agape가 읽는 환경변수. config.py는 os.environ을 .env보다 우선한다.
  NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
  NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
  PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
  # Apify — 마지막 성공 run의 데이터만 읽는다(크레딧 미소모). run 트리거는 하지 않음.
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  APIFY_INSTAGRAM_TASK_ID: ${{ secrets.APIFY_INSTAGRAM_TASK_ID }}
  # run 신선도 임계(시간) — 기본 26/72. 필요하면 레포 변수로 조정한다.
  APIFY_STALE_WARN_HOURS: ${{ vars.APIFY_STALE_WARN_HOURS }}
  APIFY_STALE_SKIP_HOURS: ${{ vars.APIFY_STALE_SKIP_HOURS }}
  GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
  GSHEET_WEBHOOK_SECRET: ${{ secrets.GSHEET_WEBHOOK_SECRET }}
  APIFY_ALERT_EMAIL: ${{ secrets.APIFY_ALERT_EMAIL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      weekly: ${{ steps.mode.outputs.weekly }}
    steps:
      - uses: actions/checkout@v4

      - name: 실행 모드 결정 (weekly?)
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
        run: |
          # repository_dispatch(Apify 웹훅)는 SCHEDULE이 비어 있어 daily로 떨어진다 — 의도한
          # 동작이다. 주간 리포트/Pages는 월요일 cron에서만 나가야 하므로 여기 추가하지 말 것.
          WEEKLY=false
          [ "$SCHEDULE" = "0 1 * * 1" ] && WEEKLY=true
          { [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" = "true" ]; } && WEEKLY=true
          echo "weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          echo "트리거: $EVENT${SCHEDULE:+ (cron $SCHEDULE)} · 실행 모드: weekly=$WEEKLY"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: discover (weekly, 유튜브 영상 풀 갱신)
        if: steps.mode.outputs.weekly == 'true'
        run: uv run agape discover

      - name: collect (매일 — 네이버/유튜브/핀터레스트)
        run: uv run agape collect

      # 계정 API라 크레딧을 쓰지 않는다. 임계 초과 시에만(주기·단계당 1회) 메일이 나간다.
      - name: Apify 크레딧 사용률 점검 (실패는 경고)
        if: env.APIFY_TOKEN != ''
        run: uv run agape apify-usage || echo "::warning::Apify 사용률 점검 실패"

      - name: Google Sheets 적재 — key 기준 upsert (URL 설정된 경우만 · 실패는 경고)
        if: env.GSHEET_WEBHOOK_URL != ''
        run: uv run agape export-sheet || echo "::warning::시트 적재 실패 (웹앱 URL·시크릿 확인)"

      - name: 시트 데이터 표시 (Actions 로그에서 확인)
        if: env.GSHEET_WEBHOOK_URL != ''
        run: uv run agape sheet-show || echo "::warning::시트 조회 실패"

      - name: channels.yaml 생성 (레포 변수에서)
        if: steps.mode.outputs.weekly == 'true'
        env:
          CHANNELS_YAML: ${{ vars.CHANNELS_YAML }}
        run: |
          if [ -n "$CHANNELS_YAML" ]; then
            printf '%s\n' "$CHANNELS_YAML" > channels.yaml
            echo "channels.yaml 생성됨"
          fi

      # 매일 만든다. 수집은 매일 도는데 페이지가 주 1회만 갱신되면 며칠째 같은 날짜로
      # 보여 자동화가 멈춘 것처럼 읽힌다(실제로 그런 오해가 있었다). HTML 생성과 Pages
      # 배포는 외부 쿼터를 쓰지 않으므로 매일 해도 비용이 없다 — 쿼터를 쓰는 discover와
      # 수신자에게 실제로 발송되는 report --send만 주간으로 남긴다.
      # 참고: 네이버 집계는 "직전 완결 주"라서 분석 주 자체는 월요일에만 넘어가고,
      # 매일 바뀌는 것은 유튜브 급상승/인기 섹션과 신선도 표시다.
      - name: report → HTML (매일 — 페이지를 항상 최신 상태로)
        run: uv run agape report --quiet --html public/index.html

      - name: report 전송 (weekly, 채널 있을 때만 · 실패는 경고)
        if: steps.mode.outputs.weekly == 'true'
        run: |
          if [ -f channels.yaml ]; then
            uv run agape report --quiet --send || echo "::warning::리포트 전송 스킵/실패 (채널 설정·SMTP 확인)"
          else
            echo "channels.yaml 없음 — 전송 생략 (레포 변수 CHANNELS_YAML 설정 시 활성화)"
          fi

      # always(): 리포트/전송이 실패해도 그 실행에서 모은 데이터와 상태(시트 전송 기록 등)는
      # 남겨야 한다. 안 그러면 다음 실행이 같은 것을 다시 보내거나 수집분이 통째로 버려진다.
      - name: data/ 커밋백 (상태 영속화)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 인스타 원본은 커밋하지 않는다 — 제3자 계정명·캡션(개인정보)이라 공개 레포에
          # 재게시하는 셈이 된다. Apify는 매 실행이 전체 스냅샷이라 이력이 없어도 리포트는
          # 정상 동작하고(같은 잡 안에서 collect→report), 전송 상태는 data/state/에 남는다.
          git add -f data ':(exclude)data/raw/instagram_posts'
          if git diff --cached --quiet; then
            echo "데이터 변경 없음"
          else
            git commit -m "chore(data): 트렌드 스냅샷 업데이트 [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          fi

      - name: Pages 아티팩트 업로드 (매일)
        if: vars.PUBLISH_PAGES != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # 리포트를 GitHub Pages URL로 게시. PUBLISH_PAGES=false 로 끌 수 있다.
  deploy-pages:
    needs: run
    if: vars.PUBLISH_PAGES != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
